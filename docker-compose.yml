version: '3.8'

services:
  pegasus_agent:
    build: .
    container_name: santos_pegasus_agent
    restart: always
    ports:
      - "8000:8000"
    environment:
      - OCI_DEPLOYMENT=true
    env_file:
      - .env
    volumes:
      - ./documentos:/app/documentos
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
